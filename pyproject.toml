[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scidoc-local"
version = "0.1.0"
description = "Local-first scientific document intelligence and reconstruction"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Scientific Document Intelligence contributors" }]
dependencies = [
  "alembic>=1.14,<2",
  "dramatiq[redis]>=1.17,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "latex2mathml>=3.77,<4",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=10.4,<12",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pymupdf>=1.24,<2",
  "python-multipart>=0.0.12,<1",
  "pyyaml>=6.0,<7",
  "redis>=5.1,<6",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.4,<26",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
ocr = [
  "pytesseract>=0.3.13,<1",
  "rapidocr-onnxruntime>=1.4,<2",
]
paddle = ["paddleocr>=2.9,<4", "paddlepaddle>=2.6,<4"]
math = ["pix2tex>=0.1.4,<1"]
voice = [
  "kokoro-onnx>=0.5,<0.6",
  "soundfile>=0.13,<1",
]
dev = [
  "mypy>=1.11,<2",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
scidoc = "scidoc_cli.main:app"

[tool.setuptools.packages.find]
where = [
  "apps/api/src",
  "packages/core/src",
  "packages/schema/python",
  "packages/pdf/src",
  "packages/layout/src",
  "packages/preprocessing/src",
  "packages/engines/src",
  "packages/routing/src",
  "packages/validation/src",
  "packages/pipeline/src",
  "packages/jobs/src",
  "packages/storage/src",
  "packages/database/src",
  "packages/exporters/src",
  "packages/search/src",
  "packages/evaluation/src",
  "packages/observability/src",
  "cli/src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = [
  "apps/api/src",
  "packages/core/src",
  "packages/pdf/src",
  "packages/layout/src",
  "packages/preprocessing/src",
  "packages/engines/src",
  "packages/routing/src",
  "packages/validation/src",
  "packages/pipeline/src",
  "packages/jobs/src",
  "packages/storage/src",
  "packages/database/src",
  "packages/exporters/src",
  "packages/search/src",
  "packages/evaluation/src",
  "packages/observability/src",
  "cli/src",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
untyped_calls_exclude = ["pymupdf"]
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["migrations", "tests"]
mypy_path = [
  "apps/api/src",
  "packages/core/src",
  "packages/schema/python",
  "packages/pdf/src",
  "packages/layout/src",
  "packages/preprocessing/src",
  "packages/engines/src",
  "packages/routing/src",
  "packages/validation/src",
  "packages/pipeline/src",
  "packages/jobs/src",
  "packages/storage/src",
  "packages/database/src",
  "packages/exporters/src",
  "packages/search/src",
  "packages/evaluation/src",
  "packages/observability/src",
  "cli/src",
]

[[tool.mypy.overrides]]
module = [
  "fitz",
  "fitz.*",
  "pymupdf",
  "pymupdf.*",
  "paddleocr",
  "paddleocr.*",
  "pix2tex",
  "pix2tex.*",
  "pytesseract",
  "pytesseract.*",
  "rapidocr_onnxruntime",
  "rapidocr_onnxruntime.*",
  "kokoro_onnx",
  "kokoro_onnx.*",
  "soundfile",
  "soundfile.*",
  "torch",
  "torch.*",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["scidoc_core", "scidoc_pdf", "scidoc_pipeline", "scidoc_api"]
